# Hermes Docs — Root Index
# Top-level entry point for discovering this repository's structure
#
# For agents: fetch this file first to understand the repo layout,
# then fetch docs/index.yaml for the full documentation index.

project:
  name: "hermes-docs"
  description: "Community-driven, AI-elaborated documentation for Hermes Agent (Nous Research)"
  repository: "https://github.com/kos-domus/hermes-docs"
  upstream: "https://github.com/NousResearch/hermes-agent"
  license: "MIT"

structure:
  sessions:
    path: "sessions/"
    description: "Raw work session logs contributed by the community"
    template: "sessions/_template.md"
    schema: "sessions/schema.yaml"

  docs:
    path: "docs/"
    index: "docs/index.yaml"
    description: "Structured documentation generated by Kos (elaboration engine)"
    categories:
      - slug: "getting-started"
        path: "docs/getting-started/"
        description: "Installation, first run, basic setup"
      - slug: "guides"
        path: "docs/guides/"
        description: "Step-by-step how-to: profiles, gateway, cron, integrations"
      - slug: "reference"
        path: "docs/reference/"
        description: "Complete reference: CLI, profile, MCP, skills, tools"
      - slug: "concepts"
        path: "docs/concepts/"
        description: "Architecture, mental models, design decisions"
      - slug: "troubleshooting"
        path: "docs/troubleshooting/"
        description: "Known issues, errors, and solutions"

  changelog:
    path: "changelog/CHANGELOG.md"
    description: "Log of all Kos elaboration runs"

  strategy:
    path: "strategy/"
    description: "Architecture decisions, multi-profile fleet design, migration patterns"

  skill_draft:
    path: "skill-draft/"
    description: "Draft skills before promotion to Hermes catalog or distribution"

fetching:
  docs_index: "docs/index.yaml"
  raw_base_url: "https://raw.githubusercontent.com/kos-domus/hermes-docs/main/"
  example: "curl -s ${raw_base_url}docs/index.yaml"

versions:
  hermes_agent_baseline: "0.14.0"
  doc_format_version: 1
